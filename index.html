<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b67">
  <title>Warga RT005 — Portal Warga Digital</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">RT</div>
        <div><strong>Warga RT</strong><small>Portal RT 005 / RW 003</small></div>
      </div>
      <div class="side-label">MENU UTAMA</div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-page="warga"><span>♙</span> Data Warga</button>
        <button class="nav-item" data-page="pengumuman"><span>▤</span> Pengumuman</button>
        <button class="nav-item" data-page="keuangan"><span>◈</span> Keuangan & Iuran</button>
        <button class="nav-item" data-page="surat"><span>▧</span> Surat Online <i id="letterBadge">2</i></button>
        <button class="nav-item" data-page="pengaduan"><span>⚑</span> Pengaduan</button>
        <button class="nav-item" data-page="agenda"><span>▦</span> Agenda RT</button>
        <button class="nav-item" data-page="laporan"><span>▥</span> Laporan</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><b>Butuh bantuan?</b><p>Hubungi pengurus RT melalui menu pengaduan.</p></div>
        <div class="profile-mini"><div class="avatar">AR</div><div><b>Admin RT</b><small>Administrator</small></div><button id="logoutBtn" title="Keluar">↪</button></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button>
        <div class="crumb"><span>Portal Warga</span><b>/</b><strong id="pageCrumb">Dashboard</strong></div>
        <div class="top-actions"><span class="today" id="today"></span><button class="icon-btn" title="Notifikasi" id="notifBtn">♧<em></em></button><div class="avatar small">AR</div></div>
      </header>
      <section class="content" id="content"></section>
      <footer>© 2026 Warga RT005 · Portal pelayanan dan informasi warga</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="modal"><form method="dialog" id="modalForm"><div class="modal-head"><h3 id="modalTitle">Tambah data</h3><button class="close" value="cancel">×</button></div><div id="modalBody"></div><div class="modal-actions"><button class="btn ghost" value="cancel">Batal</button><button class="btn primary" id="modalSave" value="default">Simpan</button></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
